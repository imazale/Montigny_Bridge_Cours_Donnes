<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours de Bridge - Répertoire des Donnes</title>
    <!-- Utilisation du design moderne Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">
    <div class="max-w-5xl mx-auto bg-white shadow-lg rounded-xl overflow-hidden p-6 md:p-8">
        <header class="border-b border-slate-200 pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-900">🎴 Cours de Bridge MBC - S'entrainer sur les donnes vues en cours</h1>
            <p class="text-sm text-slate-500 mt-1">Rejouez les donnes en ligne et visionnez les commentaires du formateur.</p>
        </header>

        <div class="overflow-x-auto">

			<div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6 space-y-4">
				
				<!-- 1. Sélection de la famille et 2. Compteur de donnes -->
				<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
					<div class="w-full sm:w-2/3">
						<label for="famille-select" class="block text-sm font-medium text-slate-700 mb-1">Sélectionner une famille :</label>
						<select id="famille-select" onchange="onFamilleChange(this.value)" class="w-full p-2.5 border border-slate-300 rounded-lg bg-white shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
							<!-- Les options s'injecteront ici -->
						</select>
					</div>
					
					<!-- Le compteur -->
					<div class="flex items-center gap-2 sm:self-end">
						<span class="text-sm text-slate-600">Donnes disponibles :</span>
						<span id="total-donnes" class="px-3 py-1.5 bg-blue-100 text-blue-800 rounded-md font-bold text-sm">0</span>
					</div>
				</div>


				<!-- 3. Boutons télécharger et Aléatoire placé sous la famille -->
				<div class="flex items-center gap-2">

					<a id="btn-download-excel" href="#" download class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg shadow-sm transition inline-flex items-center gap-1.5">
						<span>📥</span> Télécharger le tableau Excel
					</a>
					
					<button id="btn-hasard" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium rounded-lg shadow-sm transition inline-flex items-center gap-1.5">
						<span>🎲</span> Donne au hasard
					</button>					
				</div>
				
			</div>		
            <table class="w-full text-left border-collapse" id="table-donnes">
                <thead>
                    <tr class="bg-slate-100 text-slate-700 uppercase text-xs tracking-wider">
                        <th class="py-3 px-4 font-semibold">Source</th>
                        <th class="py-3 px-4 font-semibold">Donne</th>
                        <th class="py-3 px-4 font-semibold text-center">Actions</th>
                        <th class="py-3 px-4 font-semibold text-center">Commentaires</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-200 text-sm">
                    <!-- Les lignes seront chargées dynamiquement depuis le CSV -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script pour lire automatiquement le fichier CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
		let allData = []; // Variable globale pour stocker toutes les données du CSV
		let historiqueTirages = [];
		
		Papa.parse("data/recapitulatif_donnes.csv", {
			download: true,
			header: true,
			delimiter: ";",
			complete: function(results) {
			
				// Filtrer les lignes valides
				allData = results.data.filter(row => row.DONNE && row.DONNE.trim() !== "");
                console.log("Lignes après filtre :", allData.length);
				// Filtrer les lignes valides (qui contiennent au moins une donne)
				allData = results.data.filter(row => row.DONNE && row.DONNE.trim() !== "");
				
				// 1. Extraire la liste unique des familles présentes dans le CSV
				const famillesSet = new Set();
				allData.forEach(row => {
					if (row.FAMILLE) {
						famillesSet.add(row.FAMILLE.trim());
					}
				});
				const familles = Array.from(famillesSet).sort();

				// 2. Remplir dynamiquement le menu déroulant
				const select = document.getElementById('famille-select');
				select.innerHTML = ""; // Vider au cas où
				
				familles.forEach((fam, index) => {
					const option = document.createElement('option');
					option.value = fam;
					option.textContent = fam;
					select.appendChild(option);
				});

				// 3. Afficher par défaut la première famille de la liste (au lieu de tout afficher)
				if (familles.length > 0) {
					select.value = familles[0];
					renderTable(familles[0]);
					mettreAJourLienExcel();
				}

				// 4. Écouter les changements de sélection pour filtrer instantanément
				select.addEventListener('change', function() {
					renderTable(this.value);
				});
			}
		});

		// Fonction pour filtrer et afficher le tableau selon la famille choisie
		function renderTable(familleSelectionnee) {
			const tbody = document.getElementById('table-body');
			tbody.innerHTML = ""; // Vider le tableau
			
			// Masquer et vider le résultat aléatoire lors d'un changement de famille
			const resultDiv = document.getElementById('random-result');
			if (resultDiv) {
				resultDiv.classList.add('hidden');
				resultDiv.innerHTML = "";
			}

			// Récupérer les donnes jouées depuis le localStorage une seule fois pour optimiser
			const jouees = JSON.parse(localStorage.getItem('bridge_donnes_jouees')) || [];

			// Filtrer les lignes qui correspondent à la famille sélectionnée
			const lignesFiltrees = allData.filter(row => row.FAMILLE && row.FAMILLE.trim() === familleSelectionnee);

			// Mettre à jour le compteur du nombre de donnes
			document.getElementById('total-donnes').innerText = lignesFiltrees.length;

			// Remplir le tableau avec les lignes filtrées
			lignesFiltrees.forEach(row => {
				const tr = document.createElement('tr');
				
				// Clé unique identique à celle enregistrée au clic sur "Jouer"
				const cleDonne = `${row.FULL_SOURCE}_${row.DONNE}`;
				const dejaJouee = jouees.includes(cleDonne);

				// Appliquer la couleur de fond verte si déjà jouée
				tr.className = dejaJouee 
					? "border-b bg-slate-200/70 hover:bg-slate-200 transition" 
					: "border-b hover:bg-slate-50 transition";
				
				// Bouton Actions (LINK) avec appel de marquerCommeJouee et rechargement visuel
				const lienHtml = row.LINK && row.LINK.trim() !== ""
					? `<a href="${row.LINK}" target="_blank" onclick="marquerCommeJouee('${row.FULL_SOURCE.replace(/'/g, "\\'")}', '${row.DONNE}')" class="inline-flex items-center px-2.5 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-medium rounded-md transition">Jouer ↗</a>` 
					: '';

				// Petit bouton d'annulation discret qui apparaît uniquement si la donne a été jouée
				const annulerHtml = dejaJouee
					? `<button onclick="basculerEtatDonne('${row.FULL_SOURCE.replace(/'/g, "\\'")}', '${row.DONNE}')" class="ml-2 px-2 py-1 bg-slate-300 hover:bg-slate-400 text-slate-700 text-xs font-medium rounded transition" title="Considérer comme non jouée">Remettre non jouée</button>`
					: '';

				tr.innerHTML = `
					<td class="py-3 px-4 font-mono text-xs text-slate-600 truncate max-w-xs" title="${row.FULL_SOURCE || ''}">${row.FULL_SOURCE || ''}</td>
					<td class="py-3 px-4 font-semibold text-slate-700">${row.DONNE || ''}</td>
					<td class="py-3 px-4 text-center">
						${lienHtml}
						${annulerHtml}
					</td>
					<td class="py-3 px-4 text-center">
						<a href="data/${row.FILE}" target="_blank" class="inline-flex items-center px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-medium rounded-md transition">Commentaires ↗</a>
					</td>
				`;
				tbody.appendChild(tr);
			});
		}

	function tirerDonneAuHasard() {

		// Cible uniquement les lignes du corps du tableau (adaptez l'ID si nécessaire)
		const lignesVisibles = document.querySelectorAll("#table-body tr");

		if (lignesVisibles.length === 0) {
			alert("Aucune donne disponible pour cette sélection !");
			return;
		}

		const indexAleatoire = Math.floor(Math.random() * lignesVisibles.length);
		const ligneCible = lignesVisibles[indexAleatoire];

		ligneCible.scrollIntoView({
			behavior: "smooth",
			block: "start"
		});

		ligneCible.classList.add("bg-emerald-100", "transition-colors", "duration-500");
		setTimeout(() => {
			ligneCible.classList.remove("bg-emerald-100");
		}, 2000);
	}

	// Fonction pour enregistrer une donne comme jouée
	function marquerCommeJouee(fullSource, numeroDonne) {
	
		// Clé unique pour identifier la donne (ex: chemin + numéro)
		const cleDonne = `${fullSource}_${numeroDonne}`;
		
		// Récupérer la liste existante depuis le localStorage
		let jouees = JSON.parse(localStorage.getItem('bridge_donnes_jouees')) || [];
		
		// Si elle n'y est pas déjà, on l'ajoute
		if (!jouees.includes(cleDonne)) {
			jouees.push(cleDonne);
			localStorage.setItem('bridge_donnes_jouees', JSON.stringify(jouees));
		}
	}	

	// Fonction pour basculer l'état d'une donne (jouée <-> non jouée)
	function basculerEtatDonne(fullSource, numeroDonne) {
		const cleDonne = `${fullSource}_${numeroDonne}`;
		let jouees = JSON.parse(localStorage.getItem('bridge_donnes_jouees')) || [];
		
		const index = jouees.indexOf(cleDonne);
		if (index > -1) {
			// Si elle était jouée, on la retire (on la remet en "non jouée")
			jouees.splice(index, 1);
		} else {
			// Sinon, on l'ajoute
			jouees.push(cleDonne);
		}
		
		// Sauvegarder dans le localStorage
		localStorage.setItem('bridge_donnes_jouees', JSON.stringify(jouees));
		
		// Rafraîchir le tableau pour mettre à jour instantanément les couleurs et les boutons
		const select = document.getElementById('famille-select');
		if (select && select.value) {
			renderTable(select.value);
		}
	}

	// Fonction déclenchée lors du changement de famille dans le menu déroulant
	function onFamilleChange(famille) {
		// Nettoyer les espaces superflus de la famille sélectionnée
		const familleSelectionnee = famille ? famille.trim() : "";

		// 1. Réinitialiser l'historique des tirages aléatoires et masquer le bloc
		historiqueTirages = [];
		const resultDiv = document.getElementById('random-result');
		if (resultDiv) {
			resultDiv.classList.add('hidden');
			resultDiv.innerHTML = "";
		}

		// 2. Mettre à jour le tableau principal avec la nouvelle famille
		renderTable(familleSelectionnee);
	}	


	// Fonction pour nettoyer le nom de la famille de la même manière qu'en Python
	function nettoyerNomFamille(famille) {
		if (!famille) return "toutes_les_donnes"; // ou un nom par défaut global si besoin
		return famille.replace(/[^\w\sÀ-ÿ-]/g, "_").trim();
	}

	function mettreAJourLienExcel() {
		const select = document.getElementById('famille-select');
		const btnDownload = document.getElementById('btn-download-excel');
		
		if (!select || !btnDownload) return;

		const familleActive = select.value.trim();
		
		if (familleActive) {
			const familleClean = nettoyerNomFamille(familleActive);
			// Chemin vers le fichier spécifique de la famille généré par Python
			btnDownload.href = `data/donnes_bridge_${familleClean}.xlsx`;
			btnDownload.download = `donnes_bridge_${familleClean}.xlsx`;
			btnDownload.style.display = "inline-flex"; // Afficher le bouton
		} else {
			// Si aucune famille n'est sélectionnée (ou option "Toutes"), 
			// tu peux pointer vers un fichier global si tu en génères un, ou masquer le bouton
			btnDownload.href = `data/donnes_bridge.xlsx`;
			btnDownload.download = `donnes_bridge.xlsx`;
		}
	}

	// Écouter le changement de sélection dans le menu déroulant
	document.getElementById('famille-select')?.addEventListener('change', mettreAJourLienExcel);

	// Appeler la fonction au chargement de la page pour initialiser le lien
	document.addEventListener('DOMContentLoaded', mettreAJourLienExcel);

	// Relier au bouton
	document.getElementById("btn-hasard")?.addEventListener("click", tirerDonneAuHasard);	
	
    </script>
</body>
</html>
